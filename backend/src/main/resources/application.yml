spring:
  application:
    name: hr-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hrsystem}
    username: ${DATABASE_USERNAME:hrsystem}
    password: ${DATABASE_PASSWORD:hrsystem}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:./application-local.yml

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  demo:
    seed: ${APP_DEMO_SEED:false}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cron:
    secret: ${CRON_SECRET:dev-cron-secret}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemini-2.5-flash}
    site-url: ${OPENROUTER_SITE_URL:http://localhost:5173}
    site-name: ${OPENROUTER_SITE_NAME:PulseHR}
