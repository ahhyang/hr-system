services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hrsystem
      POSTGRES_USER: hrsystem
      POSTGRES_PASSWORD: hrsystem
    ports:
      - "5432:5432"
    volumes:
      - hrsystem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsystem -d hrsystem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hrsystem_pgdata:
