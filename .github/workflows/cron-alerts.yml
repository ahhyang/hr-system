name: Daily HR Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary and alerts
        run: |
          curl -sf -X POST "${{ secrets.RENDER_API_URL }}/api/v1/cron/daily" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
